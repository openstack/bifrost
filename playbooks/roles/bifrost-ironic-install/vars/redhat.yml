---
init_dest_dir: /usr/lib/systemd/system/
ipxe_dir: "/usr/share/ipxe/{{ 'arm64-efi/' if ansible_architecture == 'aarch64' else '' }}"
ipxe_efi_binary: "{{ 'snponly.efi' if ansible_architecture == 'aarch64' else 'ipxe-snponly-x86_64.efi' }}"
ironic_rootwrap_dir: /usr/bin/
mysql_service_name: mariadb
tftp_service_name: tftp
dnsmasq_leases_file: "/var/lib/dnsmasq/dnsmasq.leases"
efi_distro: "{{ ansible_facts['distribution'] | lower }}"
grub_efi_package: "grub2-efi-{{ efi_arch }}"
grub_efi_binary: "/boot/efi/EFI/{{ efi_distro }}/grub{{ efi_arch }}.efi"
shim_efi_package: "shim-{{ efi_arch }}"
shim_efi_binary: "/boot/efi/EFI/{{ efi_distro }}/shim{{ efi_arch }}.efi"
# Used when patching Cirros GRUB for serial console (testing only).
# guestfish is provided by the libguestfs package on Fedora/EL.
cirros_console_patch_packages:
  - libguestfs
required_packages:
  - mariadb-server
  - dnsmasq
  - python3-devel
  - libffi-devel
  - libxslt-devel
  - openssl-devel
  - libxml2-devel
  - "{{ 'ipxe-bootimgs-aarch64' if ansible_architecture == 'aarch64' else 'ipxe-bootimgs' }}"
  - parted
  - ipmitool
  - psmisc
  - wget
  - xorriso
  - kernel-tools
  - qemu-img
  - python3-libselinux
  - python3-policycoreutils
  - gcc
  - socat
  - firewalld
  - python3-firewall
  - "{{ 'syslinux-nonlinux' if ansible_architecture != 'aarch64' else '' }}"
  - dosfstools
